name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Frontend
        run: |
          docker build -t ankitks001/dd-mean-frontend:latest ./frontend
          docker push ankitks001/dd-mean-frontend:latest

      - name: Build & Push Backend
        run: |
          docker build -t ankitks001/dd-mean-backend:latest ./backend
          docker push ankitks001/dd-mean-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd discoverdollar-mean-devops
            docker compose pull
            docker compose up -d --force-recreate